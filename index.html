
<!DOCTYPE html>
<html lang="zh-Hant" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網上手寫輸入法 KC904</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        body {
            background-color: #262a33; 
            font-family: "Microsoft JhengHei", "PingFang HK", "Noto Sans TC", sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        .retro-header-bg {
            background: linear-gradient(to bottom, #4a5363 0%, #333b47 40%, #2b323c 100%);
            border-top: 1px solid #6c7787;
            border-bottom: 2px solid #1a1e24;
        }

        .font-calligraphy {
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Snell Roundhand', cursive;
            color: #f6d365;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .btn-metallic {
            background: linear-gradient(to bottom, #fdfdfd 0%, #e0e0e0 40%, #cccccc 100%);
            border: 1px solid #888;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(0,0,0,0.1);
            color: #222;
            font-weight: bold;
            transition: all 0.1s;
        }
        .btn-metallic:active {
            background: linear-gradient(to bottom, #bbb 0%, #d4d4d4 60%, #eee 100%);
            border-top: 1px solid #555;
            border-left: 1px solid #555;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-left: 1px solid #ccc; }
        ::-webkit-scrollbar-thumb { background: #a0a0a0; border-radius: 3px; }

        .canvas-container {
            background-color: #eef2f7;
            background-image: 
                linear-gradient(#d5dce6 1px, transparent 1px),
                linear-gradient(90deg, #d5dce6 1px, transparent 1px);
            background-size: 50% 50%;
            background-position: center center;
        }
        
        .char-item:hover, .phrase-item:hover {
            background-color: #c9d6e6;
        }

        .char-item:active, .phrase-item:active {
            background-color: #b0c2de;
        }

        #textOutput {
            background-image: repeating-linear-gradient(transparent, transparent 31px, #e2e8f0 31px, #e2e8f0 32px);
            line-height: 32px;
            background-attachment: local;
        }
    </style>
</head>
<body class="flex items-center justify-center p-2 h-full w-full">

    <div class="w-full max-w-4xl bg-[#3b4252] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-gray-600 ring-4 ring-[#2a303c] h-[95vh] max-h-[750px]">
        
        <!-- Header -->
        <div class="retro-header-bg h-20 flex items-center justify-between px-6 relative shrink-0">
            <div class="flex items-center space-x-3 w-full select-none">
                <span class="text-white text-xs tracking-widest font-semibold mt-2 opacity-90 hidden sm:inline">ONLINE HANDWRITING</span>
                <span class="text-white text-lg tracking-widest mt-2 hidden sm:inline">網上</span>
                <span class="text-white text-5xl font-serif italic tracking-widest" style="font-family: 'Kaiti', 'STKaiti', serif; text-shadow: 2px 2px 4px #000;">手寫</span>
                <span class="text-white text-lg tracking-widest mt-2">輸入法</span>
            </div>
            <div class="absolute top-2 right-4 text-3xl font-calligraphy tracking-wider select-none">KC904</div>
        </div>

        <!-- Content -->
        <div class="bg-[#d7dde3] p-2 flex-grow flex flex-col min-h-0">
            
            <textarea id="textOutput" class="w-full h-24 p-3 text-2xl rounded bg-white border border-gray-400 shadow-inner focus:outline-none resize-none mb-2 text-gray-800 font-serif" placeholder="請在此處手寫繪畫..."></textarea>
            
            <div class="flex flex-row flex-grow bg-white border border-gray-400 shadow-sm min-h-0 overflow-hidden rounded">
                
                <!-- Drawing Canvas -->
                <div class="flex-grow relative canvas-container h-full" id="canvasWrapper">
                    <canvas id="drawCanvas" class="w-full h-full cursor-crosshair absolute top-0 left-0"></canvas>
                    <div id="statusIndicator" class="absolute bottom-2 left-2 text-xs text-gray-500 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200">
                        準備手寫...
                    </div>
                </div>

                <!-- Candidates -->
                <div class="w-[280px] shrink-0 flex flex-row border-l border-gray-400 bg-white h-full">
                    <div id="charCandidates" class="w-16 border-r border-gray-300 bg-[#f4f7f9] overflow-y-auto flex flex-col text-2xl items-center py-1 text-gray-800 font-serif shrink-0"></div>
                    <div id="phraseCandidates" class="flex-grow overflow-y-auto flex flex-col text-lg font-serif py-1 bg-white text-gray-800"></div>
                </div>

                <!-- Punctuation -->
                <div class="w-10 bg-[#e1e6eb] border-l border-gray-400 flex flex-col items-center text-lg font-serif py-1 shrink-0 overflow-y-auto select-none">
                    <div class="bg-[#444c5a] text-white rounded text-xs px-1 py-[2px] mb-1 shadow-sm font-sans">寫</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">,</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">。</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">、</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">?</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">!</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">:</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">;</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">「</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">」</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">—</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">+</div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-row h-12 mt-2 gap-1 shrink-0">
                <button id="btnUndo" class="flex-1 btn-metallic rounded-l-md text-2xl font-bold" title="復原上一筆">↺</button>
                <button id="btnClear" class="flex-1 btn-metallic text-xl font-bold" title="清空畫布">X</button>
                <button id="btnBackspace" class="flex-1 btn-metallic text-xl font-bold" title="退格刪除字元">⌫</button>
                <button id="btnToggleSimp" class="flex-1 btn-metallic text-xl tracking-widest font-bold">轉簡</button>
                <button id="btnCopy" class="flex-1 btn-metallic rounded-r-md text-xl tracking-widest font-bold" title="複製所有文字">複製</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const textOutput = document.getElementById('textOutput');
        const charCandidates = document.getElementById('charCandidates');
        const phraseCandidates = document.getElementById('phraseCandidates');
        const statusIndicator = document.getElementById('statusIndicator');

        let isDrawing = false;
        let traces = [];
        let currentTrace = [];
        let fetchTimeout = null;
        let isSimplifiedMode = false;

        // 初始化畫布尺寸
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            redrawCanvas();
        }

        // 監聽視窗縮放
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // 取得滑鼠或觸控點的座標
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // 畫布事件監聽 (支援滑鼠與手機觸控)
        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getCoords(e);
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#262a33';
            ctx.beginPath();
            ctx.moveTo(x, y);

            currentTrace = { x: [x], y: [] };
            // Google API 需要包含時間戳記，或直接傳入遞增的虛擬時間陣列
            currentTrace.t = [Date.now()]; 
            currentTrace.y.push(y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCoords(e);
            ctx.lineTo(x, y);
            ctx.stroke();

            currentTrace.x.push(x);
            currentTrace.y.push(y);
            currentTrace.t.push(Date.now());
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentTrace.x && currentTrace.x.length > 0) {
                traces.push(currentTrace);
}
currentTrace = [];
triggerRecognition();
}
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);
canvas.addEventListener('touchstart', startDrawing, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDrawing);
// 重新繪製所有筆跡
function redrawCanvas() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.lineWidth = 4;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#262a33';
traces.forEach(trace => {
if (trace.x.length === 0) return;
ctx.beginPath();
ctx.moveTo(trace.x[0], trace.y[0]);
for (let i = 1; i < trace.x.length; i++) {
ctx.lineTo(trace.x[i], trace.y[i]);
}
ctx.stroke();
});
}
// 緩衝發送識別請求 (防抖動)
function triggerRecognition() {
clearTimeout(fetchTimeout);
if (traces.length === 0) return;
statusIndicator.innerText = "識別中...";
statusIndicator.className = "absolute bottom-2 left-2 text-xs text-amber-600 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none";
fetchTimeout = setTimeout(() => {
fetchHandwriting();
}, 400); // 停止書寫 400 毫秒後送出
}
// 呼叫 Google Input Tools 免費手寫識別 API
function fetchHandwriting() {
// 重組 API 所需的筆跡資料格式
const apiInk = traces.map(t => [t.x, t.y, t.t]);
const requestBody = {
app: "mobilesearch",
itc: "zh-t-i0-handwrit", // 支援中文手寫 (多語系通用)
device: "navigator.userAgent",
ink: apiInk,
language: "zh"
};
fetch('google.com', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(requestBody)
})
.then(res => res.json())
.then(data => {
statusIndicator.innerText = "準備手寫...";
statusIndicator.className = "absolute bottom-2 left-2 text-xs text-gray-500 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none";
if (data && data[0] === "SUCCESS") {
const candidates = data[1][0][1];
displayCandidates(candidates);
}
})
.catch(err => {
console.error("手寫識別失敗：", err);
statusIndicator.innerText = "連線失敗，請重試";
statusIndicator.className = "absolute bottom-2 left-2 text-xs text-red-600 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none";
});
}
// 顯示字詞候選字
function displayCandidates(list) {
charCandidates.innerHTML = "";
if (!list || list.length === 0) return;
list.slice(0, 10).forEach(char => {
const item = document.createElement('div');
item.className = "char-item w-full text-center py-2 border-b border-gray-200 cursor-pointer transition-colors select-none";
item.innerText = char;
item.addEventListener('click', () => {
insertText(char);
clearCanvas();
});
charCandidates.appendChild(item);
});
}
// 插入文字到文字框中
function insertText(text) {
const start = textOutput.selectionStart;
const end = textOutput.selectionEnd;
const currentVal = textOutput.value;
textOutput.value = currentVal.substring(0, start) + text + currentVal.substring(end);
textOutput.focus();
textOutput.selectionStart = textOutput.selectionEnd = start + text.length;
}
// 功能按鈕：復原上一筆 ↺
document.getElementById('btnUndo').addEventListener('click', () => {
if (traces.length > 0) {
traces.pop();
redrawCanvas();
if (traces.length > 0) {
triggerRecognition();
} else {
charCandidates.innerHTML = "";
}
}
});
// 功能按鈕：清空畫布 X
function clearCanvas() {
traces = [];
ctx.clearRect(0, 0, canvas.width, canvas.height);
charCandidates.innerHTML = "";
}
document.getElementById('btnClear').addEventListener('click', clearCanvas);
// 功能按鈕：退格 ⌫
document.getElementById('btnBackspace').addEventListener('click', () => {
const start = textOutput.selectionStart;
const end = textOutput.selectionEnd;
const currentVal = textOutput.value;
if (start === end && start > 0) {
textOutput.value = currentVal.substring(0, start - 1) + currentVal.substring(end);
textOutput.selectionStart = textOutput.selectionEnd = start - 1;
} else {
textOutput.value = currentVal.substring(0, start) + currentVal.substring(end);
textOutput.selectionStart = textOutput.selectionEnd = start;
}
textOutput.focus();
});
// 功能按鈕：複製文字
document.getElementById('btnCopy').addEventListener('click', () => {
if (!textOutput.value) return;
textOutput.select();
document.execCommand('copy');
alert('文字已成功複製到剪貼簿！');
});
// 標點符號欄點擊事件
document.querySelectorAll('.punct-btn').forEach(btn => {
btn.addEventListener('click', () => {
insertText(btn.innerText);
});
});
// 功能按鈕：轉簡 / 轉繁 (已整合網頁載入的 OpenCC)
const btnToggleSimp = document.getElementById('btnToggleSimp');
btnToggleSimp.addEventListener('click', () => {
if (!textOutput.value) {
isSimplifiedMode = !isSimplifiedMode;
btnToggleSimp.innerText = isSimplifiedMode ? "轉繁" : "轉簡";
return;
}
if (!isSimplifiedMode) {
// 繁轉簡
const converter = OpenCC.Converter({ from: 'tw', to: 'cn' });
textOutput.value = converter(textOutput.value);
isSimplifiedMode = true;
btnToggleSimp.innerText = "轉繁";
} else {
// 簡轉繁
const converter = OpenCC.Converter({ from: 'cn', to: 'tw' });
textOutput.value = converter(textOutput.value);
isSimplifiedMode = false;
btnToggleSimp.innerText = "轉簡";
}
});
