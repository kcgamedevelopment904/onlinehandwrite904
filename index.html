<!DOCTYPE html>
<html lang="zh-Hant" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網上手寫輸入法 - 超靈敏 Online Handwriting Input Method</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for retro/brush script aesthetics -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .brush-title {
            font-family: 'Ma Shan Zheng', cursive, 'Noto Sans TC', sans-serif;
        }

        /* Metallic Gradient for Buttons */
        .btn-metallic {
            background: linear-gradient(to bottom, #ffffff 0%, #e6e9ef 48%, #d1d6e0 52%, #e2e6ed 100%);
            border: 1px solid #8e99a8;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .btn-metallic:hover {
            background: linear-gradient(to bottom, #ffffff 0%, #f0f3f8 48%, #dce2eb 52%, #ebf0f7 100%);
        }
        .btn-metallic:active {
            background: linear-gradient(to bottom, #c0c6d0 0%, #d8dde6 100%);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
            transform: translateY(1px);
        }

        /* Dark Metallic Header */
        .header-metallic {
            background: linear-gradient(to bottom, #434a54 0%, #2b3038 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 5px rgba(0,0,0,0.4);
        }

        /* Ultra-Sensitive Active Glow Pulse */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.8); }
        }
        .sensitive-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Custom Scrollbar for list areas */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-800 h-full flex items-center justify-center p-2 sm:p-4 text-slate-900 font-sans">

    <!-- Main Container Frame -->
    <div class="w-full max-w-2xl bg-slate-700 rounded-xl overflow-hidden border-2 border-slate-600 shadow-2xl flex flex-col">
        
        <!-- Retro Header Title Bar -->
        <header class="header-metallic px-3 py-2.5 flex items-center justify-between border-b border-slate-800 text-white relative">
            <div class="flex-1 text-right text-[11px] sm:text-xs font-bold tracking-wider text-slate-300 pr-1">
                ONLINE HANDWRITING
            </div>
            
            <div class="flex items-center gap-1.5 px-2">
                <span class="text-xs sm:text-sm font-bold text-slate-200">網上</span>
                <span class="brush-title text-3xl sm:text-4xl text-white font-normal drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] tracking-widest px-1">手寫</span>
                <span class="text-xs sm:text-sm font-bold text-slate-200">輸入法</span>
            </div>

            <div class="flex-1 text-left text-[11px] sm:text-xs font-bold tracking-wider text-slate-300 pl-1 flex items-center gap-2">
                <span>INPUT METHOD</span>
            </div>
        </header>

        <!-- Status & Ultra-Sensitivity Toolbar -->
        <div class="bg-slate-800 border-b border-slate-600 px-3 py-1 flex items-center justify-between text-xs text-slate-300">
            <div class="flex items-center gap-2">
                <span class="sensitive-glow inline-flex items-center gap-1 bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/50 font-medium text-[11px]">
                    <i class="fa-solid fa-bolt text-amber-400 animate-bounce"></i> 超靈敏 ⚡ 0-Delay 模式
                </span>
                <span id="speedIndicator" class="hidden sm:inline text-slate-400 text-[11px]">即時辨識 (15ms)</span>
            </div>

            <div class="flex items-center gap-2">
                <label for="sensitivityRange" class="text-[11px] text-slate-300 hidden sm:inline">靈敏度:</label>
                <input id="sensitivityRange" type="range" min="5" max="50" value="15" class="w-16 sm:w-20 accent-emerald-500 cursor-pointer" title="調整辨識延遲毫秒數">
            </div>
        </div>

        <!-- Main Window Container -->
        <div class="bg-slate-300 p-2 sm:p-3 flex flex-col gap-2">
            
            <!-- Output Textarea Area -->
            <div class="relative bg-white border border-slate-400 rounded-sm shadow-inner">
                <textarea id="outputArea" class="w-full h-20 sm:h-24 p-2.5 text-lg sm:text-xl text-slate-900 leading-relaxed font-sans resize-none focus:outline-none" placeholder="手寫輸入文字將顯示於此..."></textarea>
                <div class="absolute bottom-1 right-1 text-slate-400 pointer-events-none text-xs">
                    <i class="fa-solid fa-ellipsis-vertical transform rotate-45"></i>
                </div>
            </div>

            <!-- Handwriting Pad + Candidates + Punctuation Grid -->
            <div class="flex h-72 sm:h-80 border border-slate-400 rounded-sm bg-white overflow-hidden shadow-sm">
                
                <!-- Left: Ultra-Responsive Drawing Canvas -->
                <div class="relative flex-1 bg-[#eef2f5] border-r border-slate-300 flex flex-col">
                    <canvas id="handwritingCanvas" class="w-full h-full cursor-crosshair touch-none z-10"></canvas>
                    
                    <!-- Rice Grid / Guidelines Background -->
                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-25">
                        <div class="w-full h-[1px] bg-slate-500 border-dashed"></div>
                        <div class="h-full w-[1px] bg-slate-500 border-dashed absolute"></div>
                    </div>

                    <!-- Instant Recognition Pulse -->
                    <div id="loadingIndicator" class="absolute top-2 left-2 text-[11px] text-emerald-700 font-semibold bg-emerald-50 border border-emerald-300 px-2 py-0.5 rounded shadow-sm opacity-0 transition-opacity flex items-center gap-1 z-20">
                        <i class="fa-solid fa-bolt text-amber-500"></i> 極速辨識中
                    </div>
                </div>

                <!-- Middle Left: Candidates Column -->
                <div class="w-12 sm:w-14 bg-slate-100 border-r border-slate-300 flex flex-col items-center py-1.5 gap-1.5 overflow-y-auto" id="charCandidates">
                    <span class="text-xs text-slate-400 italic mt-2">待寫</span>
                </div>

                <!-- Middle Right: Associated Words / Phrases Column -->
                <div class="w-28 sm:w-36 bg-slate-100 border-r border-slate-300 flex flex-col py-1 overflow-y-auto text-sm sm:text-base" id="phraseCandidates">
                    <div class="text-xs text-slate-400 px-2 py-1 italic">聯想字詞...</div>
                </div>

                <!-- Far Right: Vertical Punctuation Toolbar -->
                <div class="w-8 sm:w-10 bg-slate-200 flex flex-col items-center py-1 gap-1 text-xs sm:text-sm font-medium border-l border-slate-300">
                    <div class="w-6 h-6 bg-[#2c323b] text-white rounded-sm flex items-center justify-center font-bold text-xs mb-1 shadow-sm">
                        寫
                    </div>
                    
                    <div class="flex flex-col items-center gap-1 w-full overflow-y-auto no-scrollbar" id="punctuationList">
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">，</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">。</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">、</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">？</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">！</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">：</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">；</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">「</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">」</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">—</button>
                        <button class="w-6 h-6 hover:bg-slate-300 rounded flex items-center justify-center">+</button>
                    </div>
                </div>
            </div>

            <!-- Bottom Metallic Action Toolbar -->
            <div class="grid grid-cols-6 gap-1.5 sm:gap-2 pt-1">
                <button id="undoBtn" title="復原上一筆" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold flex items-center justify-center hover:text-blue-700 transition">
                    <i class="fa-solid fa-rotate-left text-base sm:text-lg"></i>
                </button>
                
                <button id="clearBtn" title="清除寫字板" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold text-base sm:text-lg hover:text-red-600 transition">
                    X
                </button>
                
                <button id="simpTradToggleBtn" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold text-xs sm:text-sm hover:text-blue-700 transition flex items-center justify-center">
                    轉簡
                </button>
                
                <button id="copyBtn" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold text-xs sm:text-sm hover:text-blue-700 transition flex items-center justify-center gap-1">
                    複製 <span class="text-[10px] sm:text-xs font-normal opacity-75">F8</span>
                </button>
                
                <button id="speakBtn" title="語音朗讀" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold flex items-center justify-center hover:text-blue-700 transition">
                    <i class="fa-solid fa-play text-xs sm:text-sm"></i>
                </button>

                <button id="searchBtn" title="搜尋文字" class="btn-metallic h-9 sm:h-10 rounded text-slate-800 font-bold flex items-center justify-center hover:text-blue-700 transition">
                    <i class="fa-solid fa-magnifying-glass text-sm sm:text-base"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs sm:text-sm px-4 py-2 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastText">訊息通知</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM References
            const canvas = document.getElementById('handwritingCanvas');
            const ctx = canvas.getContext('2d', { desynchronized: true });
            const outputArea = document.getElementById('outputArea');
            const charCandidates = document.getElementById('charCandidates');
            const phraseCandidates = document.getElementById('phraseCandidates');
            const punctuationList = document.getElementById('punctuationList');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const sensitivityRange = document.getElementById('sensitivityRange');
            const speedIndicator = document.getElementById('speedIndicator');

            // Buttons
            const undoBtn = document.getElementById('undoBtn');
            const clearBtn = document.getElementById('clearBtn');
            const simpTradToggleBtn = document.getElementById('simpTradToggleBtn');
            const copyBtn = document.getElementById('copyBtn');
            const speakBtn = document.getElementById('speakBtn');
            const searchBtn = document.getElementById('searchBtn');

            // Sensitivity & Performance Config
            let recognitionDelay = 15; // ultra-responsive default (15ms)
            let isDrawing = false;
            let currentStroke = { x: [], y: [] };
            let strokes = [];
            let timer = null;
            let isSimplifiedOutput = false;
            let lastPoint = null;

            // Dictionary of common associated Cantonese/Mandarin words
            const phraseDictionary = {
                '網': ['在', '穩', '崗', '起來', '長', '立', '出來', '不住腳', '住', '台'],
                '手': ['機', '寫', '指', '錶', '工', '勢', '術', '提', '套', '冊'],
                '中': ['文', '國', '心', '華', '午', '央', '間', '等', '古', '毒'],
                '大': ['家', '學', '小', '人', '地', '海', '量', '氣', '同', '成'],
                '一': ['起', '定', '樣', '直', '切', '些', '下', '半', '心', '生'],
                '不': ['是', '過', '用', '會', '好', '知', '同', '得', '能', '少'],
                '在': ['於', '場', '線', '家', '心', '前', '座', '地', '職', '位']
            };

            // High DPI Canvas Scaling
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                redrawCanvas();
            }

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: Math.round(e.clientX - rect.left),
                    y: Math.round(e.clientY - rect.top)
                };
            }

            // High-precision Ultra-Sensitive Pointer Handler
            function startPointer(e) {
                if (e.button !== undefined && e.button !== 0) return;
                canvas.setPointerCapture(e.pointerId);
                isDrawing = true;
                
                const pos = getCoordinates(e);
                currentStroke = { x: [pos.x], y: [pos.y] };
                lastPoint = pos;

                // Draw initial point
                ctx.beginPath();
                ctx.fillStyle = '#1e293b';
                ctx.arc(pos.x, pos.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            function movePointer(e) {
                if (!isDrawing) return;

                const pos = getCoordinates(e);
                currentStroke.x.push(pos.x);
                currentStroke.y.push(pos.y);

                // Smooth stroke interpolation
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 4.5;

                if (lastPoint) {
                    ctx.moveTo(lastPoint.x, lastPoint.y);
                    const midX = (lastPoint.x + pos.x) / 2;
                    const midY = (lastPoint.y + pos.y) / 2;
                    ctx.quadraticCurveTo(lastPoint.x, lastPoint.y, midX, midY);
                } else {
                    ctx.moveTo(pos.x, pos.y);
                }
                ctx.stroke();
                lastPoint = pos;

                // Ultra-sensitive recognition preview on points move
                triggerInstantRecognition();
            }

            function stopPointer(e) {
                if (!isDrawing) return;
                isDrawing = false;
                lastPoint = null;

                if (currentStroke.x.length > 0) {
                    strokes.push(currentStroke);
                    triggerInstantRecognition(true); // Force instant call
                }
            }

            function redrawCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                strokes.forEach(stroke => {
                    if (stroke.x.length < 2) return;
                    ctx.beginPath();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 4.5;

                    ctx.moveTo(stroke.x[0], stroke.y[0]);
                    for (let i = 1; i < stroke.x.length; i++) {
                        ctx.lineTo(stroke.x[i], stroke.y[i]);
                    }
                    ctx.stroke();
                });
            }

            function clearCanvas() {
                strokes = [];
                currentStroke = { x: [], y: [] };
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                charCandidates.innerHTML = `<span class="text-xs text-slate-400 italic mt-2">待寫</span>`;
            }

            function undoStroke() {
                if (strokes.length > 0) {
                    strokes.pop();
                    redrawCanvas();
                    if (strokes.length > 0) {
                        triggerInstantRecognition(true);
                    } else {
                        charCandidates.innerHTML = `<span class="text-xs text-slate-400 italic mt-2">待寫</span>`;
                    }
                }
            }

            // Instant Recognition Trigger with Dynamic Throttle/Debounce
            function triggerInstantRecognition(immediate = false) {
                if (timer) clearTimeout(timer);
                loadingIndicator.style.opacity = '1';

                const delay = immediate ? 0 : recognitionDelay;

                timer = setTimeout(() => {
                    fetchRecognitionResults();
                }, delay);
            }

            async function fetchRecognitionResults() {
                if (strokes.length === 0 && currentStroke.x.length === 0) {
                    loadingIndicator.style.opacity = '0';
                    return;
                }

                // Combine finished strokes + active stroke for zero-latency recognition
                const activeStrokes = [...strokes];
                if (isDrawing && currentStroke.x.length > 0) {
                    activeStrokes.push(currentStroke);
                }

                const inkData = [
                    activeStrokes.map(s => s.x),
                    activeStrokes.map(s => s.y),
                    []
                ];

                const requestBody = {
                    app_version: 0.4,
                    api_level: "537.36",
                    device: "5.0 (Windows NT 10.0; Win64; x64)",
                    input_type: 0,
                    options: "enable_homophone_converter",
                    requests: [{
                        writer_id: "ultra_sensitive_handwriting",
                        ink: [inkData],
                        language: isSimplifiedOutput ? "zh-Hans" : "zh-Hant"
                    }]
                };

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 600); // 600ms strict timeout

                    const response = await fetch('https://www.google.com/inputtools/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);
                    const data = await response.json();

                    if (data && data[0] === 'SUCCESS') {
                        const candidates = data[1][0][1];
                        renderCharCandidates(candidates);
                    }
                } catch (err) {
                    // Fallback to offline heuristic gesture guess if network request delays
                    renderFallbackCandidates(activeStrokes);
                } finally {
                    loadingIndicator.style.opacity = '0';
                }
            }

            // Local Stroke Feature Heuristic Fallback Engine
            function renderFallbackCandidates(activeStrokes) {
                if (activeStrokes.length === 0) return;
                const totalPoints = activeStrokes.reduce((acc, s) => acc + s.x.length, 0);

                let fallbackChars = ['一', '乙', '十', '人', '大', '中', '網'];
                if (activeStrokes.length === 1) {
                    fallbackChars = ['一', '丨', '丿', '乙', '丶'];
                } else if (activeStrokes.length === 2) {
                    fallbackChars = ['十', '人', '八', '九', '卜', '二'];
                } else if (activeStrokes.length >= 3 && activeStrokes.length <= 5) {
                    fallbackChars = ['口', '山', '女', '水', '木', '中', '手'];
                } else {
                    fallbackChars = ['網', '繁', '靈', '筆', '畫', '國'];
                }

                renderCharCandidates(fallbackChars);
            }

            function renderCharCandidates(candidates) {
                charCandidates.innerHTML = '';
                if (!candidates || candidates.length === 0) {
                    charCandidates.innerHTML = `<span class="text-xs text-slate-400 italic mt-2">無</span>`;
                    return;
                }

                candidates.slice(0, 8).forEach(char => {
                    const btn = document.createElement('button');
                    btn.className = 'w-9 h-9 hover:bg-emerald-100 text-slate-900 font-bold text-lg sm:text-xl rounded transition flex items-center justify-center shrink-0 border border-transparent hover:border-emerald-400 active:scale-95';
                    btn.textContent = char;
                    btn.addEventListener('click', () => {
                        insertText(char);
                        updatePhrases(char);
                        clearCanvas();
                    });
                    charCandidates.appendChild(btn);
                });

                if (candidates.length > 0) {
                    updatePhrases(candidates[0]);
                }
            }

            function updatePhrases(char) {
                phraseCandidates.innerHTML = '';
                const phrases = phraseDictionary[char] || ['在', '穩', '崗', '起來', '長', '立', '出來', '不住腳', '住', '台'];

                phrases.forEach((phrase, idx) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center px-2 py-0.5 hover:bg-emerald-100 cursor-pointer transition rounded text-slate-800 gap-1.5 active:bg-emerald-200';
                    
                    const num = document.createElement('span');
                    num.className = 'text-xs text-slate-400 font-mono w-3';
                    num.textContent = (idx + 1) % 10;

                    const text = document.createElement('span');
                    text.className = 'font-medium truncate text-sm sm:text-base';
                    text.textContent = phrase;

                    row.appendChild(num);
                    row.appendChild(text);

                    row.addEventListener('click', () => {
                        insertText(phrase);
                    });

                    phraseCandidates.appendChild(row);
                });

                const plusRow = document.createElement('div');
                plusRow.className = 'px-2 py-1 text-slate-400 hover:text-slate-700 cursor-pointer font-bold text-center';
                plusRow.textContent = '+';
                phraseCandidates.appendChild(plusRow);
            }

            function insertText(str) {
                const start = outputArea.selectionStart;
                const end = outputArea.selectionEnd;
                const val = outputArea.value;

                outputArea.value = val.substring(0, start) + str + val.substring(end);
                outputArea.selectionStart = outputArea.selectionEnd = start + str.length;
                outputArea.focus();
            }

            function showToast(text) {
                const toast = document.getElementById('toast');
                const toastText = document.getElementById('toastText');
                toastText.textContent = text;
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            }

            function toggleSimpTrad() {
                isSimplifiedOutput = !isSimplifiedOutput;
                simpTradToggleBtn.textContent = isSimplifiedOutput ? '轉繁' : '轉簡';
                showToast(isSimplifiedOutput ? '已切換為簡體輸出' : '已切換為繁體輸出');
                if (strokes.length > 0) fetchRecognitionResults();
            }

            function copyText() {
                if (!outputArea.value) {
                    showToast('目前無可複製文字');
                    return;
                }
                outputArea.select();
                try {
                    document.execCommand('copy');
                    showToast('文字已複製到剪貼簿 (F8)');
                } catch (e) {
                    showToast('複製失敗');
                }
            }

            // Punctuation insert
            punctuationList.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    insertText(e.target.textContent.trim());
                }
            });

            // Ultra-responsive Pointer Event listeners
            canvas.addEventListener('pointerdown', startPointer);
            canvas.addEventListener('pointermove', movePointer);
            canvas.addEventListener('pointerup', stopPointer);
            canvas.addEventListener('pointercancel', stopPointer);

            // Sensitivity slider listener
            sensitivityRange.addEventListener('input', (e) => {
                recognitionDelay = parseInt(e.target.value, 10);
                speedIndicator.textContent = `即時辨識 (${recognitionDelay}ms)`;
            });

            // Button Action listeners
            undoBtn.addEventListener('click', undoStroke);
            clearBtn.addEventListener('click', clearCanvas);
            simpTradToggleBtn.addEventListener('click', toggleSimpTrad);
            copyBtn.addEventListener('click', copyText);

            speakBtn.addEventListener('click', () => {
                if (!outputArea.value) return;
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(outputArea.value);
                    utterance.lang = 'zh-TW';
                    window.speechSynthesis.speak(utterance);
                } else {
                    showToast('瀏覽器不支援語音朗讀');
                }
            });

            searchBtn.addEventListener('click', () => {
                if (!outputArea.value) {
                    showToast('請先輸入搜尋關鍵字');
                    return;
                }
                const query = encodeURIComponent(outputArea.value.trim());
                window.open(`https://www.google.com/search?q=${query}`, '_blank');
            });

            // F8 Key shortcut
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F8') {
                    e.preventDefault();
                    copyText();
                }
            });

            // Window resize handler
            window.addEventListener('resize', resizeCanvas);

            // Initialize Canvas & default phrases
            resizeCanvas();
            updatePhrases('網');
        });
    </script>
</body>
</html>
