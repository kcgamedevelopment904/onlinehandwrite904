<!DOCTYPE html>
<html lang="zh-Hant" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網上手寫輸入法 KC904</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        body {
            background-color: #262a33; 
            font-family: "Microsoft JhengHei", "PingFang HK", "Noto Sans TC", sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        .retro-header-bg {
            background: linear-gradient(to bottom, #4a5363 0%, #333b47 40%, #2b323c 100%);
            border-top: 1px solid #6c7787;
            border-bottom: 2px solid #1a1e24;
        }

        .font-calligraphy {
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Snell Roundhand', cursive;
            color: #f6d365;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .btn-metallic {
            background: linear-gradient(to bottom, #fdfdfd 0%, #e0e0e0 40%, #cccccc 100%);
            border: 1px solid #888;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(0,0,0,0.1);
            color: #222;
            font-weight: bold;
            transition: all 0.1s;
        }
        .btn-metallic:active {
            background: linear-gradient(to bottom, #bbb 0%, #d4d4d4 60%, #eee 100%);
            border-top: 1px solid #555;
            border-left: 1px solid #555;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f0f0f0; border-left: 1px solid #ccc; }
        ::-webkit-scrollbar-thumb { background: #a0a0a0; border-radius: 3px; }

        .canvas-container {
            background-color: #eef2f7;
            background-image: 
                linear-gradient(#d5dce6 1px, transparent 1px),
                linear-gradient(90deg, #d5dce6 1px, transparent 1px);
            background-size: 50% 50%;
            background-position: center center;
        }
        
        .char-item:hover, .phrase-item:hover {
            background-color: #c9d6e6;
        }

        .char-item:active, .phrase-item:active {
            background-color: #b0c2de;
        }

        #textOutput {
            background-image: repeating-linear-gradient(transparent, transparent 31px, #e2e8f0 31px, #e2e8f0 32px);
            line-height: 32px;
            background-attachment: local;
        }
    </style>
</head>
<body class="flex items-center justify-center p-2 h-full w-full">

    <div class="w-full max-w-4xl bg-[#3b4252] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-gray-600 ring-4 ring-[#2a303c] h-[95vh] max-h-[750px]">
        
        <!-- Header -->
        <div class="retro-header-bg h-20 flex items-center justify-between px-6 relative shrink-0">
            <div class="flex items-center space-x-3 w-full select-none">
                <span class="text-white text-xs tracking-widest font-semibold mt-2 opacity-90 hidden sm:inline">ONLINE HANDWRITING</span>
                <span class="text-white text-lg tracking-widest mt-2 hidden sm:inline">網上</span>
                <span class="text-white text-5xl font-serif italic tracking-widest" style="font-family: 'Kaiti', 'STKaiti', serif; text-shadow: 2px 2px 4px #000;">手寫</span>
                <span class="text-white text-lg tracking-widest mt-2">輸入法</span>
            </div>
            <div class="absolute top-2 right-4 text-3xl font-calligraphy tracking-wider select-none">KC904</div>
        </div>

        <!-- Content -->
        <div class="bg-[#d7dde3] p-2 flex-grow flex flex-col min-h-0">
            
            <textarea id="textOutput" class="w-full h-24 p-3 text-2xl rounded bg-white border border-gray-400 shadow-inner focus:outline-none resize-none mb-2 text-gray-800 font-serif" placeholder="請在此處手寫繪畫..."></textarea>
            
            <div class="flex flex-row flex-grow bg-white border border-gray-400 shadow-sm min-h-0 overflow-hidden rounded">
                
                <!-- Drawing Canvas -->
                <div class="flex-grow relative canvas-container h-full" id="canvasWrapper">
                    <canvas id="drawCanvas" class="w-full h-full cursor-crosshair absolute top-0 left-0"></canvas>
                    <div id="statusIndicator" class="absolute bottom-2 left-2 text-xs text-gray-500 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200">
                        準備手寫...
                    </div>
                </div>

                <!-- Candidates -->
                <div class="w-[280px] shrink-0 flex flex-row border-l border-gray-400 bg-white h-full">
                    <div id="charCandidates" class="w-16 border-r border-gray-300 bg-[#f4f7f9] overflow-y-auto flex flex-col text-2xl items-center py-1 text-gray-800 font-serif shrink-0"></div>
                    <div id="phraseCandidates" class="flex-grow overflow-y-auto flex flex-col text-lg font-serif py-1 bg-white text-gray-800"></div>
                </div>

                <!-- Punctuation -->
                <div class="w-10 bg-[#e1e6eb] border-l border-gray-400 flex flex-col items-center text-lg font-serif py-1 shrink-0 overflow-y-auto select-none">
                    <div class="bg-[#444c5a] text-white rounded text-xs px-1 py-[2px] mb-1 shadow-sm font-sans">寫</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">,</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">。</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">、</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">?</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">!</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">:</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">;</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">「</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">」</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">—</div>
                    <div class="punct-btn cursor-pointer hover:bg-gray-300 w-full text-center py-1">+</div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-row h-12 mt-2 gap-1 shrink-0">
                <button id="btnUndo" class="flex-1 btn-metallic rounded-l-md text-2xl font-bold" title="復原上一筆">↺</button>
                <button id="btnClear" class="flex-1 btn-metallic text-xl font-bold" title="清空畫布">X</button>
                <button id="btnBackspace" class="flex-1 btn-metallic text-xl font-bold" title="退格刪除字元">⌫</button>
                <button id="btnToggleSimp" class="flex-1 btn-metallic text-xl tracking-widest font-bold">轉簡</button>
                <button id="btnCopy" class="flex-1 btn-metallic rounded-r-md text-xl tracking-widest font-bold" title="複製所有文字">複製</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const textOutput = document.getElementById('textOutput');
        const charCandidates = document.getElementById('charCandidates');
        const phraseCandidates = document.getElementById('phraseCandidates');
        const statusIndicator = document.getElementById('statusIndicator');

        let isDrawing = false;
        let traces = [];
        let currentTrace = [];
        let fetchTimeout = null;
        let isSimplifiedMode = false;
        let lastInsertedText = '';

        // OpenCC 全字庫防彈轉換器
        let converterTradToSimp = (text) => text;
        let converterSimpToTrad = (text) => text;

        try {
            if (typeof OpenCC !== 'undefined') {
                converterTradToSimp = OpenCC.Converter({ from: 'tw', to: 'cn' });
                converterSimpToTrad = OpenCC.Converter({ from: 'cn', to: 'tw' });
            }
        } catch (e) {
            console.error("OpenCC載入失敗", e);
        }

        function convertText(text) {
            if (!text) return '';
            if (typeof OpenCC === 'undefined') return text;
            if (isSimplifiedMode) return converterTradToSimp(text);
            return converterSimpToTrad(text);
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            const rect = wrapper.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            canvas.width = rect.width;
            canvas.height = rect.height;
            setupCanvasStyle();
            redraw();
        }

        function setupCanvasStyle() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#e91e63'; // 專業朱紅色
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 150);

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: Math.round(clientX - rect.left),
                y: Math.round(clientY - rect.top)
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPointerPos(e);
            currentTrace = [[pos.x, pos.y]];
            
            setupCanvasStyle();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (fetchTimeout) clearTimeout(fetchTimeout);
            
            statusIndicator.textContent = '手寫中...';
            statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-blue-600 font-bold bg-white/90 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            
            const lastPos = currentTrace[currentTrace.length - 1];
            const dx = pos.x - lastPos[0];
            const dy = pos.y - lastPos[1];
            
            // 升級：自然平滑取樣。只要移動超過 4 像素才記錄，自然過濾多餘雜點，不需要破壞性的暴力壓縮
            if (dx * dx + dy * dy >= 16) {
                currentTrace.push([pos.x, pos.y]);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
            
            if (currentTrace.length > 0) {
                traces.push(currentTrace);
            }
            
            if (fetchTimeout) clearTimeout(fetchTimeout);
            statusIndicator.textContent = '⚡ 光速辨識中...';
            statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-blue-600 font-bold bg-white/90 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';
            
            // 延遲降低為 300 毫秒，符合正常書寫節奏
            fetchTimeout = setTimeout(recognizeStrokes, 300); 
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });
        canvas.addEventListener('touchcancel', stopDrawing, { passive: false });

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            setupCanvasStyle();
            traces.forEach(trace => {
                if (!trace || trace.length === 0) return;
                ctx.beginPath();
                ctx.moveTo(trace[0][0], trace[0][1]);
                for (let i = 1; i < trace.length; i++) {
                    ctx.lineTo(trace[i][0], trace[i][1]);
                }
                ctx.stroke();
            });
        }

        // 修正：還原 Google 標準的資料結構，去除導致報錯的空陣列
        function formatTracesForAPI(rawTraces) {
            if (!rawTraces || rawTraces.length === 0) return [];
            return rawTraces.map(trace => {
                const x = [], y = [];
                for (let i = 0; i < trace.length; i++) {
                    x.push(Math.round(trace[i][0]));
                    y.push(Math.round(trace[i][1]));
                }
                return [x, y];
            });
        }

        function extractCandidates(data) {
            let candidates = [];
            try {
                if (data && data[0] === 'SUCCESS' && data[1]) {
                    data[1].forEach(result => {
                        if (result && result[0] && result[0].length > 1) {
                            candidates = candidates.concat(result[0][1]);
                        }
                    });
                }
            } catch (e) {}
            return [...new Set(candidates)];
        }

        // ==========================================
        // 核心升級：Gemini 3 Flash 極速視覺辨識引擎
        // ==========================================
        async function recognizeViaGeminiAI() {
            return new Promise((resolve, reject) => {
                try {
                    // 1. 將畫布縮小繪製到超小記憶體 Canvas 中 (縮小圖片體積以極速發送)
                    const tempCanvas = document.createElement('canvas');
                    const scale = Math.min(200 / canvas.width, 200 / canvas.height);
                    tempCanvas.width = canvas.width * scale;
                    tempCanvas.height = canvas.height * scale;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // 白底襯托紅字，利於 AI 極速判讀
                    tempCtx.fillStyle = '#ffffff';
                    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);

                    // 轉換成超高壓縮比的 JPEG Base64
                    const base64Image = tempCanvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                    if (!base64Image) { reject('Image error'); return; }

                    const apiKey = ""; // 使用空字串，Canvas 運行環境會自動帶入驗證憑證
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const prompt = "你是極速手寫中文字辨識專家。請精準辨識這張圖片中的手寫中文字。只需輸出 5 到 8 個最可能的繁體與簡體候選字，用半角逗號分隔（例如：的,得,地,迪）。不要有任何其他文字、引號或標點。";

                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: prompt },
                                {
                                    inlineData: {
                                        mimeType: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }],
                        generationConfig: {
                            temperature: 0.1, // 低隨機性提升準確度
                            maxOutputTokens: 30
                        }
                    };

                    fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(data => {
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            // 提取 AI 回傳的所有中文字元
                            const matched = text.match(/[\u4e00-\u9fa5A-Za-z0-9]/g);
                            if (matched && matched.length > 0) {
                                resolve([...new Set(matched)]);
                                return;
                            }
                        }
                        reject("AI 無文字回傳");
                    })
                    .catch(err => reject(err));
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function recognizeStrokes() {
            if (traces.length === 0) {
                resetStatus();
                return;
            }

            statusIndicator.textContent = '⚡ Gemini AI 閃電辨識中...';
            statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-purple-700 font-bold bg-white/90 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';

            let resolved = false;

            const handleSuccess = (results, sourceName) => {
                if (resolved || !results || results.length === 0) return;
                resolved = true;
                handleSuccessfulResults(results);
                statusIndicator.textContent = `⚡ 辨識完成 (${sourceName})`;
                statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-green-600 font-bold bg-white/90 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';
            };

            // 雙通道同時併發：Gemini AI 視覺辨識 vs 標準筆劃通道
            Promise.allSettled([
                recognizeViaGeminiAI().then(res => handleSuccess(res, 'Gemini AI')),
                recognizeViaPOST().then(res => handleSuccess(res, 'Cloud Engine')),
                recognizeViaJSONP().then(res => handleSuccess(res, 'Fast Engine'))
            ]).then(() => {
                if (!resolved) {
                    statusIndicator.textContent = '請重新書寫';
                    statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-red-500 font-bold bg-white/90 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';
                }
            });
        }

        function handleSuccessfulResults(results) {
            renderCharCandidates(results);
            fetchPhrases(results[0]);
        }

        // 無字數/長度限制的 POST 請求通道
        function recognizeViaPOST() {
            return new Promise(async (resolve, reject) => {
                try {
                    const formattedInk = formatTracesForAPI(traces);
                    const payload = {
                        app_version: 0.4, api_level: "537.36", device: "5.0", input_type: 0, options: "enable_pre_space",
                        requests: [{
                            writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                            pre_context: "", max_num_results: 10, max_completions: 0, language: "zh-TW",
                            ink: formattedInk
                        }]
                    };

                    const response = await fetch('https://inputtools.google.com/request?itc=zh-TW-t-i0-handwrit&app=demopage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' }, // 使用 text/plain 完美繞過 CORS 阻擋
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    resolve(extractCandidates(data));
                } catch (error) {
                    reject(error);
                }
            });
        }

        // 修正：改回單一引擎，避免網址超長被瀏覽器強制阻擋
        function recognizeViaJSONP() {
            return new Promise((resolve, reject) => {
                const formattedInk = formatTracesForAPI(traces);
                const requestPayload = {
                    app_version: 0.4, api_level: "537.36", device: "5.0", input_type: 0, options: "enable_pre_space",
                    requests: [{ 
                        writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                        pre_context: "", max_num_results: 10, max_completions: 0, language: "zh-TW",
                        ink: formattedInk
                    }]
                };

                const cbName = 'hw_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                let resolved = false;

                const timer = setTimeout(() => {
                    if (!resolved) { cleanup(); reject('Timeout'); }
                }, 2500);

                window[cbName] = function(data) {
                    resolved = true;
                    cleanup();
                    resolve(extractCandidates(data));
                };

                function cleanup() {
                    clearTimeout(timer);
                    if (window[cbName]) delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                script.onerror = () => { cleanup(); reject('Network error'); };
                script.src = `https://inputtools.google.com/request?itc=zh-TW-t-i0-handwrit&app=demopage&response=jsonp&cb=${cbName}&data=${encodeURIComponent(JSON.stringify(requestPayload))}`;
                document.body.appendChild(script);
            });
        }

        function fetchPhrases(char) {
            if (!char) return;
            const cbName = 'phrase_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const script = document.createElement('script');

            window[cbName] = function(data) {
                cleanup();
                if (data && data[1]) {
                    let phrases = data[1].map(item => Array.isArray(item) ? item[0] : item);
                    phrases = phrases.filter(p => typeof p === 'string' && p.startsWith(char) && p.length >= 2 && p.length <= 6);
                    renderPhraseCandidates(phrases, char);
                } else {
                    renderPhraseCandidates([], char);
                }
            };

            function cleanup() {
                if (window[cbName]) delete window[cbName];
                if (script.parentNode) script.parentNode.removeChild(script);
            }

            script.onerror = function() {
                cleanup();
                renderPhraseCandidates([], char);
            };

            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&hl=zh-TW&gl=tw&q=${encodeURIComponent(char)}&callback=${cbName}`;
            document.body.appendChild(script);
        }

        function renderCharCandidates(chars) {
            charCandidates.innerHTML = '';
            if(!chars || chars.length === 0) return;

            const uniqueChars = [...new Set(chars)];
            
            uniqueChars.slice(0, 10).forEach((char) => {
                const finalChar = convertText(char);
                const div = document.createElement('div');
                div.className = 'char-item w-full text-center py-2 cursor-pointer transition-colors border-b border-gray-200 hover:bg-blue-100 font-bold text-[#1e293b]';
                div.textContent = finalChar;
                
                div.onclick = () => {
                    insertText(finalChar);
                    lastInsertedText = finalChar;
                    clearCanvas();
                    fetchPhrases(char);
                };
                charCandidates.appendChild(div);
            });
        }

        function renderPhraseCandidates(phrases, baseCharOriginal) {
            phraseCandidates.innerHTML = '';
            const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
            
            const filteredPhrases = (phrases || []).filter(p => p && p.length <= 6);
            
            if (filteredPhrases.length === 0) {
                phraseCandidates.innerHTML = '<div class="text-xs text-gray-400 p-2 text-center">無相關詞語</div>';
                return;
            }

            filteredPhrases.slice(0, 10).forEach((phrase, index) => {
                const finalPhrase = convertText(phrase);
                const finalBaseChar = convertText(baseCharOriginal);
                
                const div = document.createElement('div');
                div.className = 'phrase-item w-full py-1.5 px-3 cursor-pointer transition-colors flex items-center border-b border-gray-100 hover:bg-gray-100';
                
                const label = document.createElement('span');
                label.className = 'text-gray-400 text-xs mr-3 font-sans w-3 text-right font-bold';
                label.textContent = labels[index];
                
                const text = document.createElement('span');
                text.className = 'font-serif text-lg text-gray-800 font-bold tracking-wide';
                text.textContent = finalPhrase;
                
                div.appendChild(label);
                div.appendChild(text);
                
                div.onclick = () => {
                    const currentVal = textOutput.value;
                    if (currentVal.endsWith(finalBaseChar) && lastInsertedText === finalBaseChar) {
                        textOutput.value = currentVal.slice(0, -finalBaseChar.length);
                        insertText(finalPhrase);
                    } else {
                        const remainder = finalPhrase.startsWith(finalBaseChar) ? finalPhrase.substring(finalBaseChar.length) : finalPhrase;
                        insertText(remainder);
                    }
                    lastInsertedText = finalPhrase;
                    clearCanvas();
                    charCandidates.innerHTML = '';
                    phraseCandidates.innerHTML = '';
                };
                phraseCandidates.appendChild(div);
            });
        }

        function insertText(text) {
            const start = textOutput.selectionStart;
            const end = textOutput.selectionEnd;
            const currentVal = textOutput.value;
            textOutput.value = currentVal.substring(0, start) + text + currentVal.substring(end);
            textOutput.selectionStart = textOutput.selectionEnd = start + text.length;
            textOutput.focus();
        }

        function clearCanvas() {
            traces = [];
            currentTrace = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resetStatus();
        }
        
        function resetStatus() {
            statusIndicator.textContent = '準備手寫...';
            statusIndicator.className = 'absolute bottom-2 left-2 text-xs text-gray-500 bg-white/80 px-2 py-0.5 rounded shadow pointer-events-none transition-colors duration-200';
        }

        document.getElementById('btnClear').onclick = () => {
            clearCanvas();
            charCandidates.innerHTML = '';
            phraseCandidates.innerHTML = '';
            textOutput.focus();
        };

        document.getElementById('btnUndo').onclick = () => {
            if (traces.length > 0) {
                traces.pop();
                redraw();
                if (traces.length > 0) {
                    recognizeStrokes();
                } else {
                    clearCanvas();
                    charCandidates.innerHTML = '';
                    phraseCandidates.innerHTML = '';
                }
            }
            textOutput.focus();
        };

        document.getElementById('btnBackspace').onclick = () => {
            const start = textOutput.selectionStart;
            const end = textOutput.selectionEnd;
            const currentVal = textOutput.value;
            if (start === end && start > 0) {
                textOutput.value = currentVal.substring(0, start - 1) + currentVal.substring(end);
                textOutput.selectionStart = textOutput.selectionEnd = start - 1;
            } else if (start !== end) {
                textOutput.value = currentVal.substring(0, start) + currentVal.substring(end);
                textOutput.selectionStart = textOutput.selectionEnd = start;
            }
            textOutput.focus();
        };

        document.getElementById('btnCopy').onclick = () => {
            textOutput.select();
            document.execCommand('copy');
            const btn = document.getElementById('btnCopy');
            const originalText = btn.textContent;
            btn.textContent = '已複製!';
            btn.classList.add('text-blue-700');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('text-blue-700');
            }, 1500);
            textOutput.focus();
        };

        document.getElementById('btnToggleSimp').onclick = (e) => {
            isSimplifiedMode = !isSimplifiedMode;
            e.target.textContent = isSimplifiedMode ? "轉繁" : "轉簡";
            textOutput.value = convertText(textOutput.value);
            if (traces.length > 0) recognizeStrokes();
            textOutput.focus();
        };

        document.querySelectorAll('.punct-btn').forEach(btn => {
            btn.onclick = () => { 
                insertText(btn.textContent); 
                lastInsertedText = btn.textContent; 
            };
        });
    </script>
</body>
</html>
